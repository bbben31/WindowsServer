name: Validate curriculum

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated manifest is current
        shell: pwsh
        run: |
          .\tools\Update-CurriculumManifest.ps1
          git diff --exit-code -- metadata/curriculum-manifest.json

      - name: Validate curriculum
        shell: pwsh
        run: .\tools\Validate-Curriculum.ps1
